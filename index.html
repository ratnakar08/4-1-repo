<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Study materials and resources for 4th year 1st semester." />
    <title>4-1 Learning Repository</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#" aria-label="Home">
        <span class="brand-mark">4-1</span>
        <span class="brand-text">Learning Repository</span>
      </a>
      <div class="notification-carousel" id="notification-carousel" aria-live="polite">
        <!-- Notifications will be injected here -->
      </div>
    </header>

    <main>
      <section id="library" class="view active" aria-labelledby="library-title">
        <div class="page-head">
          <div>
            <p class="eyebrow">4th year / 1st semester</p>
            <h1 id="library-title">Study materials</h1>
          </div>
        </div>

        <div class="controls" aria-label="Library controls">
          <label class="search-box">
            <span class="sr-only">Search</span>
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input id="search-input" type="search" placeholder="Search files..." autocomplete="off" />
          </label>
          <label class="sort-box">
            <span class="sr-only">Sort by</span>
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><polyline points="19 12 12 19 5 12"></polyline></svg>
            <select id="sort-filter">
              <option value="newest">Newest First</option>
              <option value="name">Name (A-Z)</option>
              <option value="size">Size</option>
            </select>
          </label>
        </div>

        <!-- Upcoming Exams Section -->
        <section id="exams-container" class="exams-container hidden" aria-labelledby="exams-title">
          <h2 id="exams-title" class="section-title">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
            Upcoming Exams
          </h2>
          <div class="file-list" id="exams-list"></div>
        </section>

        <!-- Folder Grid -->
        <section id="folders-container" aria-label="Subjects">
          <h2 class="section-title">Subjects</h2>
          <div class="folder-grid" id="folder-grid"></div>
        </section>

        <!-- File View (Inside a Folder or Search Results) -->
        <section id="file-view" class="file-view hidden" aria-live="polite">
          <div class="file-view-header">
            <button id="back-btn" class="ghost-button">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
              Back to Folders
            </button>
            <h2 id="file-view-title" class="section-title">Files</h2>
          </div>
          <div class="file-list" id="file-list"></div>
          <p class="empty-state hidden" id="empty-state">No files found.</p>
        </section>

      </section>
    </main>

    <template id="file-template">
      <article class="file-row">
        <div class="file-icon" aria-hidden="true">
          <!-- Icon injected via JS -->
        </div>
        <div class="file-main">
          <div class="file-name-row">
            <h3 class="file-name"></h3>
            <span class="badge new-badge hidden">NEW</span>
          </div>
          <p class="file-meta"></p>
        </div>
        <a class="action-button preview-link" href="#" target="_blank" rel="noopener noreferrer">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
          Open
        </a>
      </article>
    </template>

    <template id="folder-template">
      <button class="folder-card" type="button">
        <div class="folder-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
        </div>
        <div class="folder-info">
          <h3 class="folder-name"></h3>
          <p class="folder-count"></p>
        </div>
      </button>
    </template>

    <script src="./app.js"></script>
  </body>
</html>
